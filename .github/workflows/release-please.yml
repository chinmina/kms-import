name: Release Please

on:
  push:
    branches:
      - main

# The release-please action authenticates with a GitHub App token (below), so the
# default GITHUB_TOKEN needs no permissions here.
permissions: {}

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    environment: automation
    steps:
      # A GitHub App identity is required, not cosmetic: a tag pushed with the
      # default GITHUB_TOKEN does not trigger other workflows, so the v* tag
      # release-please creates would never start release.yml. The App token's
      # push does trigger it.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Least privilege: release-please only needs to write commits/tags/
          # releases (contents) and open/update the Release PR (pull-requests).
          permission-contents: write
          permission-pull-requests: write

      # Opens/updates the Release PR. On merge it creates a *draft* GitHub Release
      # (release-please-config.json: draft). A draft release does NOT create a git
      # tag, so the next step creates it explicitly.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-please
        with:
          token: ${{ steps.app-token.outputs.token }}

      # Close the release PR if a draft release already exists for that version.
      # release-please tracks "released" by published releases only — a draft
      # release doesn't count — so after a Release PR merges and creates a draft,
      # the next push to main reopens the same-version PR. Detect and close it
      # here before it causes confusion.
      - name: Close PR if draft release already exists
        if: ${{ steps.release-please.outputs.release_created != 'true' && steps.release-please.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ steps.release-please.outputs.pr }}
        run: |
          PR_TITLE=$(gh pr view "$PR_NUMBER" --json title -q '.title')
          VERSION=$(echo "$PR_TITLE" | grep -oP '\d+\.\d+\.\d+')
          if [ -n "$VERSION" ]; then
            DRAFT=$(gh release view "v${VERSION}" --json isDraft -q '.isDraft' 2>/dev/null || echo "false")
            if [ "$DRAFT" = "true" ]; then
              gh pr close "$PR_NUMBER" \
                --comment "Closing: draft release v${VERSION} already exists and is pending attestation and publication. It will be published automatically once the release workflow completes."
            fi
          fi

      # Create the git tag for the just-created draft release. GitHub does not
      # materialise a tag for a draft release, and `force-tag-creation` did not
      # produce one with this action version — so without this, release.yml
      # (triggered on tag push) never runs and the draft is never published.
      # Creating the ref with the App token (not GITHUB_TOKEN) is what lets the
      # tag push trigger release.yml; release.yml then fills the draft, attests,
      # and publishes it.
      - name: Create tag for the draft release
        if: ${{ steps.release-please.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG_NAME: ${{ steps.release-please.outputs.tag_name }}
          TAG_SHA: ${{ steps.release-please.outputs.sha }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f "ref=refs/tags/${TAG_NAME}" \
            -f "sha=${TAG_SHA}"

