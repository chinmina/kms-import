# chinmina/kms-import — release-please trigger.
name: release-please

on:
  push:
    branches: [main]

# Default-deny at the workflow level; grant the GITHUB_TOKEN ceiling on the JOB
# that calls the reusable workflow (secure by default — no other job sees it).
permissions: {}

jobs:
  release-please:
    # Caller permissions are a CEILING — a reusable workflow can only DOWNGRADE
    # the GITHUB_TOKEN, never elevate it. Grant at least what the reusable
    # workflow's job declares, or the run fails at startup.
    permissions:
      contents: read
      # REQUIRED on BOTH token paths: the reusable job declares id-token: write,
      # so the caller must match it even on the app path (where it is unused).
      id-token: write
    uses: chinmina/.github/.github/workflows/release-please.yml@verified-actions # zizmor: ignore[secrets-inherit]
    with:
      token-source: app
    # app path: the RELEASE_PLEASE_* secrets are environment-scoped, and a
    # reusable-workflow call job cannot declare an `environment:`, so they can
    # only resolve inside the reusable workflow's env-targeting job — which is
    # what `inherit` enables. A narrowed map would read empty.
    secrets: inherit
