# Second half of the release pipeline. release-please.yml (on push to main) opens
# the Release PR and, on merge, creates a draft release and pushes its v* tag;
# that tag triggers this workflow, which builds the artifacts, attests them, and
# only then publishes the draft. Splitting it this way enforces build → attest →
# publish: nothing is downloadable before its provenance attestation exists.
name: Release

on:
  push:
    # Release Please creates a tag to trigger this build
    tags:
      - "v*"

permissions:
  # publish the GitHub Release and its artifacts
  contents: write
  # OIDC token used as the keyless Sigstore signing identity for attestations
  id-token: write
  # persist build-provenance attestations to the GitHub attestations API
  attestations: write
  artifact-metadata: write

jobs:
  goreleaser:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Use the release-please GitHub App identity (not the default GITHUB_TOKEN)
      # so that publishing the release emits a workflow-triggering
      # `release: published` event for any downstream consumers.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PLEASE_APP_PRIVATE_KEY }}
          # Least privilege: this job only uploads assets to and publishes the
          # existing release, both of which need contents write only.
          permission-contents: write

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
        with:
          go-version-file: go.mod
          cache: true

      - uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4
        with:
          install: false

      - name: Read goreleaser version
        id: tool-versions
        run: echo "goreleaser=$(mise current goreleaser)" >> "$GITHUB_OUTPUT"

      - uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7
        with:
          version: ${{ steps.tool-versions.outputs.goreleaser }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Build-provenance attestation for every release artifact. The GoReleaser
      # checksum file lists each archive by digest, so one call attests them
      # all; with no predicate inputs this defaults to SLSA build provenance.
      - uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
        with:
          subject-checksums: dist/checksums.txt

      # Publish last. Until now the release-please draft (filled by GoReleaser
      # above) is unpublished, so its assets are not publicly downloadable. This
      # is the gate that enforces build → attest → publish: flip the draft off
      # only after the attestation above has been recorded.
      - name: Publish release
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
