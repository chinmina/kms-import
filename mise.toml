[tools]
go            = "1.26.4"
golangci-lint = "2.12.2"
goreleaser    = "2.16.0"
just          = "1.51.0"

# binstaller has no mise registry short name; alias the github backend so the
# tool surfaces as `binstaller` (what the shared setup-release-toolchain action
# validates with `mise ls --current --json` + `jq 'has("binstaller")'`) while
# exposing the `binst` CLI the binstaller-install-script action calls on PATH.
# generates the release-attached install.sh in the release workflow.
[tool_alias]
binstaller = "github:binary-install/binstaller"

[tools.binstaller]
version    = "0.12.0"
rename_exe = "binst" # archive ships a `binst` binary; without this mise names the shim `binstaller`
