# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: release
    binary: kms-import
    main: ./cmd/kms-import
    flags:
      - "-trimpath"
    ldflags: "-w -X github.com/chinmina/kms-import/internal/buildinfo.Version={{.Version}}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"

archives:
  - id: archives
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

changelog:
  use: github-native
  sort: asc

# Keyless Cosign signing (Sigstore OIDC). Each uploadable artifact — every
# platform archive and the checksum file — is signed with `cosign sign-blob`,
# producing a Sigstore bundle (signature + certificate) alongside it. Signing
# is part of the `release` pipeline only: `goreleaser build` (used by `just
# build` and the CI snapshot job) never reaches this stage, and real signing
# runs solely in the tag-triggered release workflow where the OIDC token is
# available. To dry-run a release locally, pass `--skip=sign`.
signs:
  - id: cosign
    cmd: cosign
    signature: "${artifact}.cosign.bundle"
    args:
      - "sign-blob"
      - "${artifact}"
      - "--bundle=${signature}"
      - "--yes"
    artifacts: all
    output: true

release:
  prerelease: auto
