# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

builds:
  - id: release
    binary: kms-import
    main: ./cmd/kms-import
    flags:
      - "-trimpath"
    ldflags: "-w -X github.com/chinmina/kms-import/internal/buildinfo.Version={{.Version}}"
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

checksum:
  name_template: "checksums.txt"

archives:
  - id: archives
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - name: kms-import
    repository:
      owner: chinmina
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_GITHUB_TOKEN }}" # set by the wrapper from the minted tap token
    # release.prerelease: auto only marks the RELEASE as prerelease; this stops
    # the cask being pushed on a prerelease tag.
    skip_upload: auto
    homepage: "https://github.com/chinmina/kms-import"
    description: "CLI and Go library for importing GitHub App private keys into AWS KMS as non-extractable key material"
    # remove the macOS quarantine xattr so the binary runs without a Gatekeeper
    # prompt after `brew install`.
    hooks:
      post:
        install: |
          if OS.mac?
            system "xattr", "-dr", "com.apple.quarantine", "#{staged_path}/kms-import"
          end

nix:
  - name: kms-import
    repository:
      owner: chinmina
      name: nixpkgs
      token: "{{ .Env.NIX_GITHUB_TOKEN }}" # set by the wrapper from the minted package-repo token
    skip_upload: auto
    homepage: "https://github.com/chinmina/kms-import"
    description: "CLI and Go library for importing GitHub App private keys into AWS KMS as non-extractable key material"
    license: "asl20"

# Changelog and release notes are owned by release-please, not GoReleaser.

# Note: artifacts are NOT signed by GoReleaser. Keyless build-provenance
# attestations are produced by the `actions/attest` step in the release
# workflow, which reads the checksum file below (`checksums.txt`) as its
# subject list so every artifact is attested by digest. Keep the checksum
# name_template stable — the workflow references `dist/checksums.txt`.

release:
  prerelease: auto
  # release-please creates the GitHub Release as a draft and force-creates the
  # tag; GoReleaser fills that existing draft (without overwriting its notes) and
  # leaves it unpublished. release.yml publishes it only after attestation runs,
  # so no artifact is downloadable before its provenance is recorded.
  draft: true
  use_existing_draft: true
  mode: keep-existing
